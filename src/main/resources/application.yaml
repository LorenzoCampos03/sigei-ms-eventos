server:
     port: ${SERVER_PORT:9085}
     forward-headers-strategy: framework

spring:
     profiles:
          active: ${SPRING_PROFILES_ACTIVE:dev}

     application:
          name: vg-ms-civic-dates

logging:
     level:
          root: INFO
          pe.edu.vallegrande.sigei: INFO
          org.springframework.security: WARN
          io.github.resilience4j: INFO
          io.r2dbc.postgresql: INFO

cloudinary:
     cloud-name: ${CLOUDINARY_CLOUD_NAME:tu_cloud_name}
     api-key: ${CLOUDINARY_API_KEY:tu_api_key}
     api-secret: ${CLOUDINARY_API_SECRET:tu_api_secret}
